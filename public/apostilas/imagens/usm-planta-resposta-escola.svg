<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="ttl dsc"><title id="ttl">Mapa de resposta na escola</title><desc id="dsc">Planta ilustrativa hipotética mostrando pontos para DEA, primeiros socorros, telefone para serviços 192 e 193, rota de acesso e saída. Cada instituição deve adaptar o mapa ao layout real.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L11 4L0 8Z" fill="#139b6b"/></marker></defs><rect width="1200" height="650" fill="#f1f8fa"/><rect width="1200" height="98" fill="#146b9f"/><g font-family="Arial,sans-serif"><text x="36" y="51" fill="#fff" font-size="32" font-weight="bold">Mapa de resposta na escola</text><text x="37" y="81" fill="#eefcf9" font-size="19">Modelo ilustrativo de localização e fluxo de resposta: adapte à planta real</text><rect x="38" y="128" width="880" height="414" rx="23" fill="white" stroke="#64858e" stroke-width="6"/><rect x="70" y="168" width="300" height="175" rx="16" fill="#e9f5f7" stroke="#a2bec6" stroke-width="3"/><text x="220" y="255.5" font-size="21" text-anchor="middle" fill="#345c68">Salas de aula</text><rect x="395" y="168" width="275" height="175" rx="16" fill="#f1f7f3" stroke="#a2bec6" stroke-width="3"/><text x="532.5" y="255.5" font-size="21" text-anchor="middle" fill="#345c68">Refeitório</text><rect x="690" y="168" width="200" height="175" rx="16" fill="#e9f5f7" stroke="#a2bec6" stroke-width="3"/><text x="790" y="255.5" font-size="21" text-anchor="middle" fill="#345c68">Pátio</text><rect x="70" y="367" width="300" height="130" rx="16" fill="#f1f7f3" stroke="#a2bec6" stroke-width="3"/><text x="220" y="432" font-size="21" text-anchor="middle" fill="#345c68">Secretaria</text><rect x="395" y="367" width="275" height="130" rx="16" fill="#e9f5f7" stroke="#a2bec6" stroke-width="3"/><text x="532.5" y="432" font-size="21" text-anchor="middle" fill="#345c68">Sala de apoio</text><rect x="692" y="366" width="195" height="130" rx="13" fill="#e4faee" stroke="#86bb9d" stroke-width="3"/><text x="790" y="410" text-anchor="middle" fill="#14684a" font-size="22" font-weight="bold">SAÍDA</text><path d="M754 448H830M812 433L830 448L812 462" fill="none" stroke="#128a61" stroke-width="9"/><path d="M218 433H389H530H702" fill="none" stroke="#149b69" stroke-width="8" stroke-dasharray="13 9" marker-end="url(#arrow)"/>
