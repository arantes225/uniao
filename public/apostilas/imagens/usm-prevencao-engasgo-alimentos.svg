<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="ttl desc">
<title id="ttl">Prevenção de engasgos na escola: uvas e salsichas devem ser adaptadas à idade</title>
<desc id="desc">Quadro comparativo educativo: uva inteira versus cortada longitudinalmente em quatro partes pequenas; salsicha em rodelas circulares versus cortada no sentido do comprimento e depois em pequenos pedaços. Mostrar exemplos de formas, não tamanhos reais. Supervisione a alimentação e respeite a idade e o desenvolvimento da criança.</desc>
