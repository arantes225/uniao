<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Sangramento intenso: o começo</title><desc id="desc">Uma medida que qualquer socorrista pode iniciar em cena segura; Reconheça: Sangue contínuo, roupa encharcada, poça ou palidez.; Pressione já: Aplique gaze ou pano limpo; pressione diretamente a ferida.; Mantenha pressão: Não solte para espiar. Se encharcar, acrescente outra compressa.; Peça apoio: Ligue 192. Treinados podem usar torniquete no membro se indicado.</desc><rect width="1200" height="710" fill="#f5f9fa"/><rect width="1200" height="110" fill="#a23d45"/><text x="42" y="49" font-size="37" font-weight="800" fill="#fff">Sangramento intenso: o começo</text><text x="42" y="84" font-size="22" fill="#fff">Uma medida que qualquer socorrista pode iniciar em cena segura</text><rect x="940" y="18" rx="16" width="222" height="40" fill="#ffffff" opacity=".16"/><text x="1051" y="46" font-size="18" text-anchor="middle" font-weight="800" fill="#fff">HEMORRAGIA</text><rect x="38" y="134" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="134" rx="22" width="12" height="236" fill="#a23d45"/><circle cx="93" cy="190" r="30" fill="#a23d45"/><text x="93" y="200" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">1</text><text x="136" y="195" font-size="28" font-weight="800" fill="#122d39">Reconheça</text><text x="72" y="255" font-size="23" fill="#364d57">Sangue contínuo, roupa encharcada,</text><text x="72" y="285" font-size="23" fill="#364d57">poça ou palidez.</text><rect x="603" y="134" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="134" rx="22" width="12" height="236" fill="#a23d45"/><circle cx="658" cy="190" r="30" fill="#a23d45"/><text x="658" y="200" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">2</text><text x="701" y="195" font-size="28" font-weight="800" fill="#122d39">Pressione já</text><text x="637" y="255" font-size="23" fill="#364d57">Aplique gaze ou pano limpo; pressione</text><text x="637" y="285" font-size="23" fill="#364d57">diretamente a ferida.</text><rect x="38" y="392" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="392" rx="22" width="12" height="236" fill="#a23d45"/><circle cx="93" cy="448" r="30" fill="#a23d45"/><text x="93" y="458" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">3</text><text x="136" y="453" font-size="28" font-weight="800" fill="#122d39">Mantenha pressão</text><text x="72" y="513" font-size="23" fill="#364d57">Não solte para espiar. Se encharcar,</text><text x="72" y="543" font-size="23" fill="#364d57">acrescente outra compressa.</text><rect x="603" y="392" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="392" rx="22" width="12" height="236" fill="#a23d45"/><circle cx="658" cy="448" r="30" fill="#a23d45"/><text x="658" y="458" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">4</text><text x="701" y="453" font-size="28" font-weight="800" fill="#122d39">Peça apoio</text><text x="637" y="513" font-size="23" fill="#364d57">Ligue 192. Treinados podem usar</text><text x="637" y="543" font-size="23" fill="#364d57">torniquete no membro se indicado.</text><rect x="37" y="652" width="1126" height="42" rx="12" fill="#a23d45" opacity=".1"/><text x="57" y="681" font-size="21" font-weight="700" fill="#233f4c">AHA/Cruz Vermelha 2024 • A prioridade é controlar a perda sanguínea</text></svg>