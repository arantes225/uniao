<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="ttl desc"><title id="ttl">Desengasgo do lactente: cinco pancadas dorsais alternadas com cinco impulsos torácicos</title><desc id="desc">Dois esquemas simplificados com manequim. À esquerda, lactente de bruços apoiado no antebraço com cabeça mais baixa e região entre as escápulas indicada. À direita, bebê virado de barriga para cima com cabeça apoiada e local para impulso torácico com a base de uma mão. Não realizar compressão abdominal em lactentes.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="4" orient="auto"><path d="M0 0L11 4L0 8Z" fill="#df6644"/></marker></defs><rect width="1200" height="680" fill="#f2f9fa"/><rect width="1200" height="91" fill="#0d5b64"/><g font-family="Arial,sans-serif"><text x="37" y="50" fill="white" font-size="32" font-weight="bold">Desengasgo grave no bebê: duas posições</text><text x="38" y="78" fill="#d8f8f5" font-size="18">AHA/AAP 2025 • alternar as etapas enquanto houver obstrução grave</text><rect x="38" y="122" width="542" height="424" rx="21" fill="#fff" stroke="#b6d2da" stroke-width="3"/><rect x="621" y="122" width="541" height="424" rx="21" fill="#fff" stroke="#b6d2da" stroke-width="3"/><circle cx="84" cy="164" r="26" fill="#138477"/><text x="84" y="174" text-anchor="middle" fill="white" font-size="25" font-weight="bold">1</text><text x="128" y="173" fill="#215563" font-size="24" font-weight="bold">5 pancadas nas costas</text><circle cx="667" cy="164" r="26" fill="#138477"/><text x="667" y="174" text-anchor="middle" fill="white" font-size="25" font-weight="bold">2</text><text x="712" y="173" fill="#215563" font-size="24" font-weight="bold">5 impulsos torácicos</text>
<g transform="rotate(11 327 348)"><path d="M137 419L492 419" stroke="#dca785" stroke-width="38" stroke-linecap="round"/><ellipse cx="295" cy="340" rx="133" ry="60" fill="#f0cab0" stroke="#b98b74" stroke-width="4"/><circle cx="443" cy="362" r="48" fill="#f0cab0" stroke="#b98b74" stroke-width="4"/><path d="M216 381L198 437M333 387L357 434" stroke="#b98b74" stroke-width="25" stroke-linecap="round"/><path d="M180 332L136 348M196 367L164 393" stroke="#b98b74" stroke-width="17" stroke-linecap="round"/></g>
<path d="M322 212L322 286" stroke="#dc5e42" stroke-width="11" marker-end="url(#arrow)"/><text x="325" y="211" text-anchor="middle" font-size="19" fill="#ac4732">Entre as escápulas</text><path d="M455 436Q480 452 494 425" stroke="#178679" stroke-width="9" fill="none"/><text x="298" y="487" text-anchor="middle" fill="#365b68" font-size="19">Cabeça e pescoço apoiados</text><text x="299" y="515" text-anchor="middle" fill="#365b68" font-size="19">Cabeça mais baixa que o tórax</text>
<g transform="rotate(12 893 355)"><path d="M724 423L1084 423" stroke="#dca785" stroke-width="38" stroke-linecap="round"/><ellipse cx="882" cy="349" rx="131" ry="60" fill="#f0cab0" stroke="#b98b74" stroke-width="4"/><circle cx="1032" cy="361" r="48" fill="#f0cab0" stroke="#b98b74" stroke-width="4"/><path d="M810 393L800 437M906 391L924 434" stroke="#b98b74" stroke-width="25" stroke-linecap="round"/></g>
<ellipse cx="865" cy="345" rx="24" ry="19" fill="#fac6b5" stroke="#dd5549" stroke-width="5" stroke-dasharray="7 5"/><path d="M862 217L862 309" stroke="#dc5e42" stroke-width="12" marker-end="url(#arrow)"/><path d="M842 255Q859 240 881 255" fill="none" stroke="#c78b67" stroke-width="26" stroke-linecap="round"/><text x="942" y="229" text-anchor="middle" fill="#ae4832" font-size="19">Base de uma mão</text><text x="893" y="486" text-anchor="middle" fill="#365b68" font-size="18">Metade inferior do esterno</text><text x="891" y="515" text-anchor="middle" fill="#365b68" font-size="18">Com cabeça apoiada</text>
<rect x="38" y="566" width="1123" height="83" rx="16" fill="#fff1e9" stroke="#dfa286" stroke-width="2"/><text x="600" y="598" text-anchor="middle" font-size="22" font-weight="bold" fill="#973f2c">Nunca faça compressões abdominais em bebês.</text><text x="600" y="624" text-anchor="middle" font-size="17" fill="#674c44">Se o bebê ficar inconsciente, acione 192 e inicie RCP; retire apenas objeto visível. Treine com manequim.</text></g></svg>