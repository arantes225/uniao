<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Revisão dos Casos Stop the Bleed</title>
  <style>
    body { background:#0f172a; color:#f8fafc; font-family:system-ui, sans-serif; margin:20px; }
    h1 { margin-bottom: 8px; }
    .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:16px; margin-top:20px; }
    .card { background:#1e293b; border-radius:12px; overflow:hidden; border:1px solid #334155; }
    img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
    .info { padding:12px; }
    .num { font-size:12px; color:#38bdf8; font-weight:bold; }
    .name { font-size:13px; margin:4px 0; word-break:break-all; }
  </style>
</head>
<body>
  <h1>28 Casos Extraídos (1672x941)</h1>
  <p>Verificando os cenários (stand de tiro, rua, etc.) e membros.</p>
  <div class="grid" id="grid"></div>
  <script>
    fetch('/casos/manifest.json')
      .then(r => r.json())
      .then(files => {
        const grid = document.getElementById('grid');
        files.forEach((f, idx) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <a href="${f}" target="_blank"><img src="${f}" loading="lazy"></a>
            <div class="info">
              <div class="num">#${idx + 1}</div>
              <div class="name">${f.replace('/casos/', '')}</div>
            </div>
          `;
          grid.appendChild(card);
        });
      });
  </script>
</body>
</html>
