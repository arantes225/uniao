<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Produto químico nos olhos</title><desc id="desc">Descontaminação inicial apenas quando o acesso for seguro; Saia do risco: Não entre em nuvem de vapor ou respingo ativo.; Inicie irrigação: Use água corrente abundante; mantenha pálpebras abertas.; Peça ajuda: Ligue 192 e informe produto e ficha de segurança, se conhecidos.; Não neutralize: Não pingue vinagre, bicarbonato ou outras substâncias.</desc><rect width="1200" height="710" fill="#f5f9fa"/><rect width="1200" height="110" fill="#1768ac"/><text x="42" y="49" font-size="37" font-weight="800" fill="#fff">Produto químico nos olhos</text><text x="42" y="84" font-size="22" fill="#fff">Descontaminação inicial apenas quando o acesso for seguro</text><rect x="940" y="18" rx="16" width="222" height="40" fill="#ffffff" opacity=".16"/><text x="1051" y="46" font-size="18" text-anchor="middle" font-weight="800" fill="#fff">QUÍMICOS</text><rect x="38" y="134" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="134" rx="22" width="12" height="236" fill="#1768ac"/><circle cx="93" cy="190" r="30" fill="#1768ac"/><text x="93" y="200" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">1</text><text x="136" y="195" font-size="28" font-weight="800" fill="#122d39">Saia do risco</text><text x="72" y="255" font-size="23" fill="#364d57">Não entre em nuvem de vapor ou</text><text x="72" y="285" font-size="23" fill="#364d57">respingo ativo.</text><rect x="603" y="134" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="134" rx="22" width="12" height="236" fill="#1768ac"/><circle cx="658" cy="190" r="30" fill="#1768ac"/><text x="658" y="200" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">2</text><text x="701" y="195" font-size="28" font-weight="800" fill="#122d39">Inicie irrigação</text><text x="637" y="255" font-size="23" fill="#364d57">Use água corrente abundante; mantenha</text><text x="637" y="285" font-size="23" fill="#364d57">pálpebras abertas.</text><rect x="38" y="392" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="392" rx="22" width="12" height="236" fill="#1768ac"/><circle cx="93" cy="448" r="30" fill="#1768ac"/><text x="93" y="458" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">3</text><text x="136" y="453" font-size="28" font-weight="800" fill="#122d39">Peça ajuda</text><text x="72" y="513" font-size="23" fill="#364d57">Ligue 192 e informe produto e ficha de</text><text x="72" y="543" font-size="23" fill="#364d57">segurança, se conhecidos.</text><rect x="603" y="392" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="392" rx="22" width="12" height="236" fill="#1768ac"/><circle cx="658" cy="448" r="30" fill="#1768ac"/><text x="658" y="458" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">4</text><text x="701" y="453" font-size="28" font-weight="800" fill="#122d39">Não neutralize</text><text x="637" y="513" font-size="23" fill="#364d57">Não pingue vinagre, bicarbonato ou</text><text x="637" y="543" font-size="23" fill="#364d57">outras substâncias.</text><rect x="37" y="652" width="1126" height="42" rx="12" fill="#1768ac" opacity=".1"/><text x="57" y="681" font-size="21" font-weight="700" fill="#233f4c">AHA/Cruz Vermelha 2024 • A FDS pode exigir cuidados específicos</text></svg>