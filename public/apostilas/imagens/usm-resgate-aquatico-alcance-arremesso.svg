<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="ttl desc"><title id="ttl">Resgate aquático por alcance ou arremesso sem entrada na água</title><desc id="desc">Dois desenhos esquemáticos de segurança: socorrista deitado ou ajoelhado em superfície firme estende uma haste para alguém na água; em outra cena lança um dispositivo de flutuação com corda. Não entrar na água sem treinamento e equipe especializada. Acionar 193.</desc><rect width="1200" height="650" fill="#eaf6fa"/><rect width="1200" height="93" fill="#0b6271"/><g font-family="Arial,sans-serif"><text x="40" y="49" font-size="33" fill="#fff" font-weight="bold">Salvamento aquático: não entre sem treinamento</text><text x="40" y="78" font-size="19" fill="#e1f6fb">Priorize alcance ou arremesso de flutuação a partir de local seguro</text>
<rect x="38" y="123" width="542" height="411" rx="23" fill="#fff" stroke="#a8cbd6" stroke-width="3"/><rect x="621" y="123" width="542" height="411" rx="23" fill="#fff" stroke="#a8cbd6" stroke-width="3"/><text x="308" y="174" font-size="25" fill="#225b68" font-weight="bold" text-anchor="middle">1. ALCANCE</text><text x="892" y="174" font-size="25" fill="#225b68" font-weight="bold" text-anchor="middle">2. ARREMESSO</text>
<rect x="60" y="335" width="228" height="151" fill="#d6d7d0"/><rect x="290" y="335" width="267" height="151" fill="#8dd0ed"/><path d="M290 357Q328 345 368 357T445 358T558 353" stroke="#fff" stroke-width="6" fill="none"/><circle cx="415" cy="324" r="32" fill="#e9ba99" stroke="#a98169" stroke-width="4"/><path d="M405 357Q427 389 422 423" stroke="#e9ba99" stroke-width="28" stroke-linecap="round"/><circle cx="150" cy="280" r="27" fill="#e9ba99" stroke="#a98169" stroke-width="4"/><path d="M145 310L212 338" stroke="#e9ba99" stroke-width="32" stroke-linecap="round"/><path d="M203 338L263 335" stroke="#e9ba99" stroke-width="21" stroke-linecap="round"/><path d="M212 328L405 326" stroke="#9f7d47" stroke-width="10" stroke-linecap="round"/><text x="310" y="508" font-size="17" fill="#436472" text-anchor="middle">Apoie-se na borda e use objeto longo</text>
<rect x="642" y="335" width="216" height="151" fill="#d6d7d0"/><rect x="860" y="335" width="279" height="151" fill="#8dd0ed"/><path d="M860 357Q908 345 948 357T1040 358T1140 354" fill="none" stroke="#fff" stroke-width="6"/><circle cx="1053" cy="321" r="31" fill="#e9ba99" stroke="#a98169" stroke-width="4"/><path d="M1045 354L1056 403" stroke="#e9ba99" stroke-width="27" stroke-linecap="round"/><circle cx="749" cy="271" r="28" fill="#e9ba99" stroke="#a98169" stroke-width="4"/><path d="M743 302L766 368" stroke="#e9ba99" stroke-width="31" stroke-linecap="round"/><path d="M752 320Q854 200 980 325" stroke="#b8955d" stroke-width="5" fill="none" stroke-dasharray="11 7"/><circle cx="986" cy="331" r="41" fill="#ee8b52" stroke="#d36633" stroke-width="5"/><circle cx="986" cy="331" r="19" fill="#8dd0ed"/><path d="M969 296L1002 364M1003 298L970 366" stroke="#fff" stroke-width="9"/><text x="892" y="508" font-size="17" fill="#436472" text-anchor="middle">Lance boia ou flutuação com corda</text>
<rect x="38" y="557" width="1124" height="69" rx="15" fill="#fff1e8" stroke="#e2a77c" stroke-width="2"/><text x="600" y="586" text-anchor="middle" font-size="23" font-weight="bold" fill="#984c33">Não pule para resgatar. Acione 193 e evite se tornar outra vítima.</text><text x="600" y="612" text-anchor="middle" font-size="17" fill="#745e52">Ilustração didática; equipamentos e distâncias dependem do local e treinamento.</text></g></svg>