<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="ttl desc"><title id="ttl">Espaço confinado: jamais entre para resgatar sem equipe especializada</title><desc id="desc">Tanque industrial visto em corte com atmosfera potencialmente perigosa representada por nuvem vermelha, vítima no interior como pictograma, socorrista fora do perímetro seguro e equipe de resgate acionada. Respirador com filtro não fornece oxigênio.</desc><defs><pattern id="haz" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M0 28L28 0" stroke="#d98b79" stroke-width="8" opacity=".3"/></pattern></defs><rect width="1200" height="640" fill="#eef7f8"/><rect width="1200" height="95" fill="#0c5b64"/><g font-family="Arial,sans-serif"><text x="39" y="49" fill="white" font-size="32" font-weight="bold">Espaço confinado: não entre para socorrer</text><text x="39" y="79" fill="#defbf5" font-size="19">Gases e falta de oxigênio podem derrubar também quem tenta ajudar</text><rect x="42" y="127" width="718" height="407" rx="22" fill="#fff" stroke="#b6d5db" stroke-width="3"/><rect x="145" y="232" width="366" height="267" rx="30" fill="#d9e8ea" stroke="#617d87" stroke-width="13"/><rect x="156" y="246" width="346" height="245" rx="24" fill="url(#haz)"/><ellipse cx="329" cy="240" rx="180" ry="48" fill="#c3dadd" stroke="#617d87" stroke-width="10"/><ellipse cx="329" cy="242" rx="158" ry="31" fill="#e7f0f1" stroke="#8fa8ac" stroke-width="4"/><circle cx="325" cy="361" r="28" fill="#a58f9b"/><path d="M326 395L326 451M298 411L353 411" stroke="#a58f9b" stroke-width="22" stroke-linecap="round"/><text x="326" y="471" fill="#8d4340" font-size="19" text-anchor="middle" font-weight="bold">ATMOSFERA DESCONHECIDA</text><path d="M565 218V501" stroke="#cb4d4b" stroke-width="9" stroke-dasharray="15 12"/><circle cx="654" cy="344" r="29" fill="#e6ba99"/><path d="M654 380L654 443M630 398L679 398M654 441L629 482M654 441L678 482" stroke="#ab816c" stroke-width="20" stroke-linecap="round"/><path d="M595 282L715 391M715 282L595 391" stroke="#c44740" stroke-width="10"/><text x="643" y="512" fill="#8c3f39" font-size="18" text-anchor="middle">NÃO ENTRAR</text>
<rect x="790" y="127" width="369" height="180" rx="22" fill="#e5f6ed" stroke="#8abb9c" stroke-width="3"/><text x="974" y="184" text-anchor="middle" fill="#24684b" font-size="27" font-weight="bold">ISOLAR + 193</text><text x="974" y="220" text-anchor="middle" fill="#426b56" font-size="19">Afaste as pessoas</text><text x="974" y="246" text-anchor="middle" fill="#426b56" font-size="19">e peça resgate especializado</text><rect x="790" y="329" width="369" height="205" rx="22" fill="#fff1e8" stroke="#d8a17c" stroke-width="3"/><text x="974" y="382" text-anchor="middle" fill="#9b4e35" font-size="24" font-weight="bold">FILTRO ≠ OXIGÊNIO</text><text x="974" y="425" text-anchor="middle" fill="#704f45" font-size="19">Máscara filtrante comum</text><text x="974" y="451" text-anchor="middle" fill="#704f45" font-size="19">não fornece ar respirável</text><text x="974" y="486" text-anchor="middle" fill="#9b4e35" font-size="18" font-weight="bold">Não improvise proteção</text><rect x="40" y="555" width="1121" height="61" rx="14" fill="#e4f2ef" stroke="#83b6a6" stroke-width="2"/><text x="600" y="592" text-anchor="middle" fill="#25614e" font-size="21" font-weight="bold">Entrada e resgate técnico dependem de equipe habilitada e proteção apropriada.</text></g></svg>