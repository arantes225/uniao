<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="tit des">
<title id="tit">Desengasgo grave em gestante no final da gravidez: compressões torácicas</title>
<desc id="des">Primeiro faça cinco pancadas nas costas. Se a obstrução grave persistir, fique atrás da pessoa e faça cinco impulsos torácicos sobre o esterno, acima do abdome gestante. Repita os ciclos, acione o SAMU 192 e inicie RCP se ficar inconsciente. Esquema didático.</desc>
<rect width="1200" height="700" fill="#f2f8f8"/>
<rect width="1200" height="98" fill="#0c6067"/>
<g font-family="Arial, sans-serif">
<text x="38" y="50" fill="white" font-size="32" font-weight="bold">Engasgo em gestante: compressão no tórax</text>
<text x="39" y="78" fill="#e3f8f3" font-size="19">Situação especial de obstrução grave • adulto consciente • AHA 2025</text>
<rect x="40" y="124" width="720" height="468" rx="23" fill="#fff" stroke="#b6d4d6" stroke-width="3"/>
<path d="M300 518V346Q290 294 333 281L399 276Q479 284 502 351Q540 429 521 516Z" fill="#b8d7eb" stroke="#528aa9" stroke-width="6"/>
<circle cx="396" cy="217" r="58" fill="#edbd9f" stroke="#b5806e" stroke-width="5"/>
<path d="M350 177Q377 145 411 164Q444 171 448 216Q432 200 429 187Q395 177 369 194Q350 209 342 230Z" fill="#544f4d"/>
<path d="M501 393Q570 405 594 464Q616 534 541 551Q468 563 442 510Z" fill="#b8d7eb" stroke="#528aa9" stroke-width="6"/>
<path d="M320 315Q299 382 314 430" fill="none" stroke="#edbd9f" stroke-width="30" stroke-linecap="round"/>
<path d="M485 311L523 392" fill="none" stroke="#edbd9f" stroke-width="26" stroke-linecap="round"/>
<path d="M388 294V390" fill="none" stroke="#73949c" stroke-width="10" stroke-dasharray="8 10"/>
<ellipse cx="391" cy="340" rx="54" ry="39" fill="#ffe3dd" stroke="#d8624d" stroke-width="5" stroke-dasharray="11 7"/>
<circle cx="189" cy="257" r="47" fill="#ddad8f" stroke="#9a7160" stroke-width="5"/>
<path d="M150 298Q118 375 138 521H267Q282 382 227 301Z" fill="#729889" stroke="#476e65" stroke-width="6"/>
<path d="M238 330Q313 291 364 331L385 351" fill="none" stroke="#ddad8f" stroke-width="30" stroke-linecap="round"/>
<path d="M175 342Q257 296 346 338L377 351" fill="none" stroke="#ddad8f" stroke-width="26" stroke-linecap="round"/>
<ellipse cx="384" cy="344" rx="27" ry="21" fill="#e7b496" stroke="#946b5c" stroke-width="4"/>
<path d="M480 340H615" stroke="#ba5947" stroke-width="5"/>
<circle cx="480" cy="340" r="8" fill="#ba5947"/>
<text x="618" y="328" text-anchor="middle" fill="#913f30" font-size="20" font-weight="bold">Compressão</text>
<text x="618" y="352" text-anchor="middle" fill="#913f30" font-size="20" font-weight="bold">sobre o esterno</text>
<path d="M550 474H641" stroke="#487d9c" stroke-width="5"/>
<text x="647" y="464" text-anchor="middle" fill="#34637c" font-size="18">Evite pressionar</text>
<text x="647" y="488" text-anchor="middle" fill="#34637c" font-size="18">o abdome</text>
<text x="395" y="576" text-anchor="middle" fill="#4b666b" font-size="18">Ilustração conceitual: posição das mãos deve ser treinada</text>
<rect x="784" y="124" width="378" height="138" rx="18" fill="#eaf6ed" stroke="#94c4a1" stroke-width="3"/>
<circle cx="823" cy="168" r="22" fill="#217b64"/><text x="823" y="176" font-size="23" font-weight="bold" text-anchor="middle" fill="white">1</text>
<text x="856" y="168" fill="#21664f" font-size="23" font-weight="bold">5 pancadas dorsais</text>
<text x="817" y="210" fill="#416c56" font-size="19">Entre as escápulas</text>
<text x="817" y="235" fill="#416c56" font-size="19">com a pessoa inclinada</text>
<rect x="784" y="278" width="378" height="149" rx="18" fill="#edf5fe" stroke="#95b5d8" stroke-width="3"/>
<circle cx="823" cy="321" r="22" fill="#356caa"/><text x="823" y="329" font-size="23" font-weight="bold" text-anchor="middle" fill="white">2</text>
<text x="855" y="320" fill="#25577d" font-size="23" font-weight="bold">5 impulsos torácicos</text>
<text x="817" y="361" fill="#466987" font-size="19">Por trás, no centro do peito;</text>
<text x="817" y="389" fill="#466987" font-size="19">não comprima o abdome</text>
<rect x="784" y="442" width="378" height="150" rx="18" fill="#fff1e8" stroke="#dfad8e" stroke-width="3"/>
<circle cx="823" cy="485" r="22" fill="#ad6647"/><text x="823" y="493" font-size="23" font-weight="bold" text-anchor="middle" fill="white">3</text>
<text x="855" y="484" fill="#925236" font-size="23" font-weight="bold">Repita e chame 192</text>
<text x="817" y="526" fill="#765a50" font-size="18">Se ficar inconsciente:</text>
<text x="817" y="555" fill="#765a50" font-size="18">inicie RCP, conforme orientação</text>
<rect x="40" y="607" width="1122" height="67" rx="15" fill="#e7f3ee" stroke="#89bcaa" stroke-width="2"/>
<text x="600" y="634" text-anchor="middle" fill="#23624d" font-size="21" font-weight="bold">Alternar cinco pancadas nas costas com cinco impulsos torácicos.</text>
<text x="600" y="659" text-anchor="middle" fill="#45665b" font-size="17">Para gestação avançada ou quando não for possível envolver o abdome. AHA 2025.</text>
</g></svg>