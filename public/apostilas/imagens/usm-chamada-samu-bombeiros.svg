<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Pedir socorro sem perder tempo</title><desc id="desc">Tenha estas informações à mão ao fazer a ligação; 192 — SAMU: Emergências médicas: parada, falta de ar e sangramento intenso.; 193 — Bombeiros: Fogo, altura, afogamento e ambiente de resgate perigoso.; Diga onde está: Endereço, cidade, ponto de referência, portão e acesso.; Descreva a vítima: Quantas pessoas, se respondem, se respiram e o que você fez.</desc><rect width="1200" height="710" fill="#f5f9fa"/><rect width="1200" height="110" fill="#0b7285"/><text x="42" y="49" font-size="37" font-weight="800" fill="#fff">Pedir socorro sem perder tempo</text><text x="42" y="84" font-size="22" fill="#fff">Tenha estas informações à mão ao fazer a ligação</text><rect x="940" y="18" rx="16" width="222" height="40" fill="#ffffff" opacity=".16"/><text x="1051" y="46" font-size="18" text-anchor="middle" font-weight="800" fill="#fff">COMUNICAÇÃO</text><rect x="38" y="134" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="134" rx="22" width="12" height="236" fill="#0b7285"/><circle cx="93" cy="190" r="30" fill="#0b7285"/><text x="93" y="200" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">1</text><text x="136" y="195" font-size="28" font-weight="800" fill="#122d39">192 — SAMU</text><text x="72" y="255" font-size="23" fill="#364d57">Emergências médicas: parada, falta de</text><text x="72" y="285" font-size="23" fill="#364d57">ar e sangramento intenso.</text><rect x="603" y="134" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="134" rx="22" width="12" height="236" fill="#0b7285"/><circle cx="658" cy="190" r="30" fill="#0b7285"/><text x="658" y="200" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">2</text><text x="701" y="195" font-size="28" font-weight="800" fill="#122d39">193 — Bombeiros</text><text x="637" y="255" font-size="23" fill="#364d57">Fogo, altura, afogamento e ambiente de</text><text x="637" y="285" font-size="23" fill="#364d57">resgate perigoso.</text><rect x="38" y="392" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="392" rx="22" width="12" height="236" fill="#0b7285"/><circle cx="93" cy="448" r="30" fill="#0b7285"/><text x="93" y="458" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">3</text><text x="136" y="453" font-size="28" font-weight="800" fill="#122d39">Diga onde está</text><text x="72" y="513" font-size="23" fill="#364d57">Endereço, cidade, ponto de referência,</text><text x="72" y="543" font-size="23" fill="#364d57">portão e acesso.</text><rect x="603" y="392" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="392" rx="22" width="12" height="236" fill="#0b7285"/><circle cx="658" cy="448" r="30" fill="#0b7285"/><text x="658" y="458" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">4</text><text x="701" y="453" font-size="28" font-weight="800" fill="#122d39">Descreva a vítima</text><text x="637" y="513" font-size="23" fill="#364d57">Quantas pessoas, se respondem, se</text><text x="637" y="543" font-size="23" fill="#364d57">respiram e o que você fez.</text><rect x="37" y="652" width="1126" height="42" rx="12" fill="#0b7285" opacity=".1"/><text x="57" y="681" font-size="21" font-weight="700" fill="#233f4c">Deixe o telefone no viva-voz e siga as orientações da central</text></svg>