name: Security and historical secret audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "21 5 * * 1"
permissions:
  contents: read
jobs:
  historical-secret-scan:
    name: Gitleaks complete reachable history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all remote branches and tags
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --tags --force
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all reachable Git history without exposing matched values
        shell: bash
        run: |
          set +e
          "$RUNNER_TEMP/gitleaks" git --log-opts="--all" --redact --exit-code 1 --report-format json --report-path "$RUNNER_TEMP/gitleaks-history.json"
          status=$?
          set -e
          # Report only filenames, abbreviated commit IDs and rule labels. Never print the detected values.
          node -e 'const fs=require("fs");const p=process.env.RUNNER_TEMP+"/gitleaks-history.json";const a=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,"utf8")):[];console.log("Security findings (metadata only):",JSON.stringify(a.map(x=>({path:x.File,commit:(x.Commit||"").slice(0,12),type:x.RuleID}))));'
          exit "$status"
