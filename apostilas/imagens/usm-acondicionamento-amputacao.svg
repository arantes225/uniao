<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="ttl desc">
<title id="ttl">Preservação de segmento amputado: gaze, saco impermeável e recipiente térmico</title>
<desc id="desc">Sequência ilustrada: cobrir o segmento com gaze limpa ligeiramente umedecida conforme orientação do serviço, colocá-lo em saco plástico fechado e transportar esse saco em recipiente refrigerado com água e gelo, sem contato direto com o gelo e sem congelar. Primeiro controlar o sangramento da vítima e chamar o SAMU 192.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f0faf9"/><stop offset="1" stop-color="#e8f2f7"/></linearGradient><marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#15827c"/></marker></defs>
<rect width="1200" height="660" fill="url(#bg)"/><rect width="1200" height="94" fill="#075d5c"/><text x="40" y="53" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="bold">Como proteger um segmento amputado</text><text x="40" y="79" fill="#d7f7f0" font-family="Arial,sans-serif" font-size="17">Primeiro proteja a vítima, controle a hemorragia e acione 192</text>
<g font-family="Arial,sans-serif">
