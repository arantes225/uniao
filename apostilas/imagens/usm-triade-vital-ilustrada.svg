<rect x="33" y="530" width="1132" height="67" rx="16" fill="#e3f3ee" stroke="#83bbaa" stroke-width="2"/><text x="600" y="561" fill="#235f50" font-size="23" text-anchor="middle" font-weight="bold">Sem circulação ou respiração adequada, o cérebro sofre rapidamente.</text><text x="600" y="584" fill="#3b6860" font-size="16" text-anchor="middle">Se a pessoa não responde e não respira normalmente, chame 192 e inicie RCP conforme treinamento.</text></g></svg>