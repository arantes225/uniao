<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="ttl desc"><title id="ttl">RCP em adulto: área de compressão e postura do socorrista</title><desc id="desc">Esquema frontal de um tórax adulto sobre superfície firme, com a base de uma mão apoiada na metade inferior do osso esterno e a outra mão sobreposta. Setas indicam força vertical com braços estendidos e retorno completo do tórax. Pratique com manequim.</desc><rect width="1200" height="660" fill="#f2f8f9"/><rect width="1200" height="96" fill="#115a63"/><g font-family="Arial,sans-serif"><text x="38" y="50" font-size="34" fill="#fff" font-weight="bold">RCP no adulto: onde apoiar as mãos</text><text x="38" y="79" font-size="19" fill="#d8f8f5">Esquema anatômico simplificado • treino prático necessário</text>
<rect x="40" y="121" width="628" height="414" rx="22" fill="#fff" stroke="#bed4db" stroke-width="3"/>
