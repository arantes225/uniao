<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="ttl desc"><title id="ttl">Sinais visuais de sangramento externo potencialmente fatal</title><desc id="desc">Três situações ilustrativas de alerta: curativo ou roupa rapidamente encharcada, sangue que flui continuamente em grande volume, poça aumentando no chão. Qualquer um desses achados exige compressão direta e ligação para 192. A aparência do sangramento pode variar.</desc><rect width="1200" height="620" fill="#f3f8f8"/><rect width="1200" height="95" fill="#0e6268"/><g font-family="Arial,sans-serif"><text x="39" y="51" fill="white" font-size="32" font-weight="bold">Reconheça sangramento que ameaça a vida</text><text x="40" y="78" fill="#e0f9f5" font-size="18">Exemplos ilustrativos — não espere todos os sinais aparecerem</text>
<rect x="35" y="125" width="358" height="407" rx="21" fill="white" stroke="#c1d8db" stroke-width="3"/><rect x="421" y="125" width="358" height="407" rx="21" fill="white" stroke="#c1d8db" stroke-width="3"/><rect x="807" y="125" width="358" height="407" rx="21" fill="white" stroke="#c1d8db" stroke-width="3"/>
<text x="214" y="177" text-anchor="middle" fill="#244f58" font-size="24" font-weight="bold">Tecido encharcado</text><rect x="116" y="234" width="194" height="172" rx="14" fill="#eef4f5" stroke="#a0bbc2" stroke-width="5"/><path d="M212 252C183 300 146 313 172 353Q204 396 248 357Q272 321 212 252Z" fill="#bb464b" opacity=".94"/><path d="M130 269L284 269M130 388L284 388" stroke="#d8e6e8" stroke-width="12"/><text x="214" y="463" text-anchor="middle" fill="#4b6970" font-size="17">Roupa ou gaze</text><text x="214" y="486" text-anchor="middle" fill="#4b6970" font-size="17">encharca rapidamente</text>
<text x="600" y="177" text-anchor="middle" fill="#244f58" font-size="24" font-weight="bold">Fluxo intenso</text><path d="M482 274Q574 235 676 271L691 319Q601 344 485 325Z" fill="#e8c3a7" stroke="#b88c72" stroke-width="5"/><path d="M599 313Q605 342 607 362Q612 390 595 412" fill="none" stroke="#bf414c" stroke-width="24" stroke-linecap="round"/><path d="M605 351Q575 380 581 394" fill="none" stroke="#bf414c" stroke-width="11"/><text x="600" y="463" text-anchor="middle" fill="#4b6970" font-size="17">Sangue sai sem parar</text><text x="600" y="486" text-anchor="middle" fill="#4b6970" font-size="17">ou em grande quantidade</text>
