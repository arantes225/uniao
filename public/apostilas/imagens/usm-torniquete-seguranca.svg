<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Torniquete: uso seguro</title><desc id="desc">Apenas para hemorragia grave de braços ou pernas; Indicação: Sangramento ameaçador à vida em braço ou perna.; Local correto: Acima da lesão; nunca sobre articulação ou ferimento.; Pare o sangramento: Aperte um dispositivo comercial conforme treinamento e fabricante.; Registre a hora: Não afrouxe; avise ao 192 o horário de aplicação.</desc><rect width="1200" height="710" fill="#f5f9fa"/><rect width="1200" height="110" fill="#a23d45"/><text x="42" y="49" font-size="37" font-weight="800" fill="#fff">Torniquete: uso seguro</text><text x="42" y="84" font-size="22" fill="#fff">Apenas para hemorragia grave de braços ou pernas</text><rect x="940" y="18" rx="16" width="222" height="40" fill="#ffffff" opacity=".16"/><text x="1051" y="46" font-size="18" text-anchor="middle" font-weight="800" fill="#fff">HEMORRAGIA</text><rect x="38" y="134" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="134" rx="22" width="12" height="236" fill="#a23d45"/><circle cx="93" cy="190" r="30" fill="#a23d45"/><text x="93" y="200" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">1</text><text x="136" y="195" font-size="28" font-weight="800" fill="#122d39">Indicação</text><text x="72" y="255" font-size="23" fill="#364d57">Sangramento ameaçador à vida em braço</text><text x="72" y="285" font-size="23" fill="#364d57">ou perna.</text><rect x="603" y="134" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="134" rx="22" width="12" height="236" fill="#a23d45"/><circle cx="658" cy="190" r="30" fill="#a23d45"/><text x="658" y="200" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">2</text><text x="701" y="195" font-size="28" font-weight="800" fill="#122d39">Local correto</text><text x="637" y="255" font-size="23" fill="#364d57">Acima da lesão; nunca sobre</text><text x="637" y="285" font-size="23" fill="#364d57">articulação ou ferimento.</text><rect x="38" y="392" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="392" rx="22" width="12" height="236" fill="#a23d45"/><circle cx="93" cy="448" r="30" fill="#a23d45"/><text x="93" y="458" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">3</text><text x="136" y="453" font-size="28" font-weight="800" fill="#122d39">Pare o sangramento</text><text x="72" y="513" font-size="23" fill="#364d57">Aperte um dispositivo comercial</text><text x="72" y="543" font-size="23" fill="#364d57">conforme treinamento e fabricante.</text><rect x="603" y="392" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="392" rx="22" width="12" height="236" fill="#a23d45"/><circle cx="658" cy="448" r="30" fill="#a23d45"/><text x="658" y="458" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">4</text><text x="701" y="453" font-size="28" font-weight="800" fill="#122d39">Registre a hora</text><text x="637" y="513" font-size="23" fill="#364d57">Não afrouxe; avise ao 192 o horário de</text><text x="637" y="543" font-size="23" fill="#364d57">aplicação.</text><rect x="37" y="652" width="1126" height="42" rx="12" fill="#a23d45" opacity=".1"/><text x="57" y="681" font-size="21" font-weight="700" fill="#233f4c">Não use torniquete no pescoço ou tronco • Treinamento supervisionado</text></svg>