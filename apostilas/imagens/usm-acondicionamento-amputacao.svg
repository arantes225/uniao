<path d="M388 331H414" stroke="#15827c" stroke-width="8" marker-end="url(#arr)"/>
<g><rect x="425" y="125" width="350" height="415" rx="24" fill="#fff" stroke="#b8d6d6" stroke-width="3"/><circle cx="466" cy="167" r="24" fill="#087b78"/><text x="466" y="175" fill="#fff" font-size="22" text-anchor="middle" font-weight="bold">2</text><text x="502" y="176" fill="#133f49" font-size="23" font-weight="bold">Feche em um saco</text><path d="M529 247H669L701 406Q693 440 667 443H533Q505 440 499 407Z" fill="#e0f2fe" opacity=".78" stroke="#3687ae" stroke-width="6"/><path d="M523 239H676M547 234L551 252M646 234L642 252" stroke="#256e93" stroke-width="8" stroke-linecap="round"/><rect x="555" y="310" width="93" height="70" rx="25" fill="#f9fcff" stroke="#a8c2cb" stroke-width="3"/><path d="M560 326L641 346M560 351L642 367" stroke="#b3ced8" stroke-width="10"/><text x="600" y="461" text-anchor="middle" fill="#375760" font-size="19">Embalagem fechada</text><text x="600" y="488" text-anchor="middle" fill="#375760" font-size="19">e impermeável</text></g>
