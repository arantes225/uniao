<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="ttl desc"><title id="ttl">Suspeita de intermação: acionar emergência e iniciar resfriamento</title><desc id="desc">Ilustração de uma pessoa retirada do sol para área sombreada, recebendo resfriamento ativo com água fria e circulação de ar sob acompanhamento. Acionar SAMU 192. Não oferecer líquidos pela boca se houver alteração da consciência. É uma demonstração educacional, não um protocolo completo.</desc><rect width="1200" height="630" fill="#eff7f8"/><rect width="1200" height="92" fill="#0b6368"/><g font-family="Arial,sans-serif"><text x="40" y="50" fill="#fff" font-size="32" font-weight="bold">Suspeita de intermação: resfrie e acione 192</text><text x="40" y="79" fill="#d9f8f1" font-size="18">Calor intenso + alteração do estado mental = emergência médica</text>
<rect x="39" y="119" width="729" height="406" rx="23" fill="#fff" stroke="#b4d3d9" stroke-width="3"/><path d="M112 260L385 172L655 260H112Z" fill="#98c3c5" stroke="#5d9999" stroke-width="5"/><path d="M151 259V458M613 259V458" stroke="#769d94" stroke-width="17" stroke-linecap="round"/><text x="384" y="178" text-anchor="middle" fill="#2c7779" font-size="23" font-weight="bold">ÁREA SOMBREADA</text><circle cx="358" cy="284" r="47" fill="#edbc9c" stroke="#b88669" stroke-width="4"/><path d="M319 335Q359 320 399 337L424 445H293Z" fill="#f0b5a1" stroke="#b88669" stroke-width="4"/><path d="M318 362L271 415M403 362L454 414" stroke="#edbc9c" stroke-width="24" stroke-linecap="round"/><path d="M324 438L305 474M397 438L421 474" stroke="#b88669" stroke-width="19" stroke-linecap="round"/><path d="M167 266Q202 278 205 316M223 254Q249 273 249 306M486 284Q511 309 501 347" fill="none" stroke="#4ba4cf" stroke-width="10" stroke-linecap="round"/><path d="M180 311L197 355M223 332L226 366M482 364L469 386" stroke="#49a6d2" stroke-width="6" stroke-linecap="round"/><circle cx="544" cy="364" r="50" fill="#d2e9f0" stroke="#6195a7" stroke-width="5"/><path d="M543 326Q568 353 545 366Q520 376 543 326M501 373Q541 352 542 381Q546 406 501 373M562 401Q541 378 566 367Q589 360 562 401" fill="#75a9ba"/><text x="404" y="507" text-anchor="middle" fill="#3c6774" font-size="18">Molhe o corpo e facilite evaporação, com segurança</text>
<rect x="794" y="119" width="368" height="185" rx="23" fill="#e8f5ff" stroke="#92bbd9" stroke-width="3"/><text x="979" y="177" text-anchor="middle" fill="#245b80" font-size="30" font-weight="bold">192</text><text x="979" y="214" text-anchor="middle" fill="#345d78" font-size="20">Acione o SAMU</text><text x="979" y="245" text-anchor="middle" fill="#345d78" font-size="18">sem retardar resfriamento</text>
<rect x="794" y="326" width="368" height="199" rx="23" fill="#fff4eb" stroke="#dca37d" stroke-width="3"/><text x="979" y="375" text-anchor="middle" fill="#915238" font-size="23" font-weight="bold">ATENÇÃO</text><text x="979" y="411" text-anchor="middle" fill="#6c574d" font-size="18">Se houver confusão,</text><text x="979" y="440" text-anchor="middle" fill="#6c574d" font-size="18">sonolência ou desmaio:</text><text x="979" y="478" text-anchor="middle" fill="#a25238" font-size="18" font-weight="bold">não dê líquidos por boca</text>
<rect x="39" y="546" width="1124" height="62" rx="14" fill="#e5f2ed" stroke="#88b8a0" stroke-width="2"/><text x="601" y="573" text-anchor="middle" font-size="20" fill="#24664c" font-weight="bold">O resfriamento eficaz pode exigir imersão em água fria com equipe preparada.</text><text x="601" y="596" text-anchor="middle" font-size="17" fill="#466b5b">Não exponha a vítima a risco de afogamento; siga orientação da central.</text></g></svg>