<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="ttl desc"><title id="ttl">Integração entre respiração, circulação e cérebro</title><desc id="desc">Esquema visual de pulmões que oxigenam o sangue, coração que o bombeia e cérebro que depende da circulação de oxigênio. Setas indicam a interdependência; o quadro explica por que respiração anormal e sangramento intenso são emergências.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L11 4L0 8Z" fill="#157f7c"/></marker></defs><rect width="1200" height="620" fill="#f2f8f9"/><rect width="1200" height="91" fill="#095e62"/><g font-family="Arial,sans-serif"><text x="40" y="48" fill="#fff" font-size="32" font-weight="bold">Por que coração, pulmões e cérebro dependem entre si?</text><text x="40" y="77" fill="#d6f6ef" font-size="18">Três funções vitais • esquema para compreender as prioridades do socorro</text>
