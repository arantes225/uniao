<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="ttl desc"><title id="ttl">Compressão direta de sangramento externo</title><desc id="desc">Esquema de um braço com ferimento coberto por gaze limpa e mão pressionando firmemente diretamente sobre a área. Sequência visual: proteger a mão se possível, exercer pressão contínua e acionar emergência quando houver sangramento grave. Evitar levantar o curativo repetidamente.</desc><defs><marker id="a" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L11 4L0 8Z" fill="#be523e"/></marker></defs><rect width="1200" height="630" fill="#f1f8f8"/><rect width="1200" height="88" fill="#095f65"/><g font-family="Arial,sans-serif"><text x="38" y="48" font-size="32" font-weight="bold" fill="white">Sangramento externo: faça pressão no local</text><text x="38" y="74" font-size="18" fill="#dcf8f5">Ilustração de primeira medida • não substitui treinamento</text><rect x="38" y="112" width="716" height="394" rx="23" fill="#fff" stroke="#b0d0d7" stroke-width="3"/><text x="395" y="155" font-size="23" text-anchor="middle" fill="#215968" font-weight="bold">Pressione o tecido diretamente sobre a ferida</text><path d="M105 343Q191 300 600 340Q650 347 678 365Q686 407 645 417Q342 446 126 397Z" fill="#ecc4a6" stroke="#b98973" stroke-width="5"/><ellipse cx="403" cy="362" rx="61" ry="25" fill="#b85857"/><rect x="342" y="325" width="132" height="88" rx="10" fill="#f6fafb" stroke="#9eb4c4" stroke-width="5"/><path d="M351 350L462 350M351 368L462 368M351 387L462 387" stroke="#cee0e6" stroke-width="9"/><path d="M418 318Q425 289 459 296L505 312Q531 319 511 345L453 373Q435 381 413 364Z" fill="#e2af91" stroke="#996b54" stroke-width="5"/><path d="M439 196V282" stroke="#c35e47" stroke-width="13" marker-end="url(#a)"/><text x="439" y="203" text-anchor="middle" font-size="21" fill="#a44c38">Pressão firme e contínua</text><text x="395" y="464" text-anchor="middle" font-size="18" fill="#446570">Use gaze ou tecido limpo; proteja as mãos quando possível</text>
<rect x="780" y="112" width="380" height="184" rx="22" fill="#e9f7ef" stroke="#7dba95" stroke-width="3"/><circle cx="822" cy="152" r="23" fill="#1c8467"/><text x="822" y="160" text-anchor="middle" font-size="22" fill="white" font-weight="bold">1</text><text x="860" y="155" font-size="24" fill="#1b614e" font-weight="bold">Mantenha</text><text x="813" y="205" font-size="19" fill="#456c5b">Não pare a pressão para</text><text x="813" y="232" font-size="19" fill="#456c5b">inspecionar a cada instante</text>
<rect x="780" y="315" width="380" height="191" rx="22" fill="#ecf3ff" stroke="#8baed2" stroke-width="3"/><circle cx="822" cy="354" r="23" fill="#356fa8"/><text x="822" y="362" text-anchor="middle" font-size="22" fill="white" font-weight="bold">2</text><text x="860" y="357" font-size="24" fill="#245b83" font-weight="bold">Peça ajuda</text><text x="813" y="405" font-size="19" fill="#466983">Em sangramento grave,</text><text x="813" y="431" font-size="19" fill="#466983">acione 192 e siga as</text><text x="813" y="457" font-size="19" fill="#466983">orientações da central</text>
<rect x="39" y="526" width="1121" height="76" rx="15" fill="#fff4e9" stroke="#d9b18e" stroke-width="2"/><text x="600" y="555" text-anchor="middle" font-size="22" fill="#95552f" font-weight="bold">Se a pressão não controlar hemorragia grave em membro, pode ser necessário torniquete.</text><text x="600" y="583" text-anchor="middle" font-size="17" fill="#6c584b">Use técnica adequada ao treinamento; preserve sua segurança e não retarde o socorro.</text></g></svg>