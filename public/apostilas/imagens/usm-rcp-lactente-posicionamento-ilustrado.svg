<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc"><title id="title">RCP em lactentes: posições das mãos recomendadas em 2025</title><desc id="desc">Esquema anatômico simplificado mostrando o bebê de costas em superfície firme, com compressões na metade inferior do esterno usando a base de uma mão ou os dois polegares com mãos envolvendo o tórax. Não usar a antiga técnica de dois dedos. A execução exige treinamento presencial.</desc><rect width="1200" height="690" fill="#f1f8f9"/><rect width="1200" height="95" fill="#105c68"/><g font-family="Arial,sans-serif"><text x="40" y="49" fill="#fff" font-size="33" font-weight="bold">RCP no lactente: posição das mãos</text><text x="40" y="79" fill="#e3fbff" font-size="19">Esquema didático atualizado • AHA/AAP 2025</text><rect x="37" y="120" width="543" height="450" rx="24" fill="#fff" stroke="#b8d5dc" stroke-width="3"/><rect x="620" y="120" width="543" height="450" rx="24" fill="#fff" stroke="#b8d5dc" stroke-width="3"/>
<text x="307" y="171" text-anchor="middle" fill="#155364" font-size="26" font-weight="bold">Opção 1: base de uma mão</text><text x="892" y="171" text-anchor="middle" fill="#155364" font-size="26" font-weight="bold">Opção 2: dois polegares</text>
