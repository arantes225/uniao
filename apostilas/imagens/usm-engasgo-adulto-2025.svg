<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Engasgo grave: adulto</title><desc id="desc">Também orienta a técnica em crianças maiores de 1 ano; Tosse eficaz?: Se fala e tosse forte, incentive a tosse e observe.; 5 pancadas nas costas: Com obstrução grave, incline a pessoa e aplique entre as escápulas.; 5 compressões abdominais: Alterne com as pancadas até o objeto sair ou a pessoa desmaiar.; Exceções e parada: Gestante avançada: impulsos torácicos. Inconsciente: RCP.</desc><rect width="1200" height="710" fill="#f5f9fa"/><rect width="1200" height="110" fill="#0b7285"/><text x="42" y="49" font-size="37" font-weight="800" fill="#fff">Engasgo grave: adulto</text><text x="42" y="84" font-size="22" fill="#fff">Também orienta a técnica em crianças maiores de 1 ano</text><rect x="940" y="18" rx="16" width="222" height="40" fill="#ffffff" opacity=".16"/><text x="1051" y="46" font-size="18" text-anchor="middle" font-weight="800" fill="#fff">VIAS AÉREAS</text><rect x="38" y="134" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="134" rx="22" width="12" height="236" fill="#0b7285"/><circle cx="93" cy="190" r="30" fill="#0b7285"/><text x="93" y="200" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">1</text><text x="136" y="195" font-size="28" font-weight="800" fill="#122d39">Tosse eficaz?</text><text x="72" y="255" font-size="23" fill="#364d57">Se fala e tosse forte, incentive a</text><text x="72" y="285" font-size="23" fill="#364d57">tosse e observe.</text><rect x="603" y="134" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="134" rx="22" width="12" height="236" fill="#0b7285"/><circle cx="658" cy="190" r="30" fill="#0b7285"/><text x="658" y="200" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">2</text><text x="701" y="195" font-size="28" font-weight="800" fill="#122d39">5 pancadas nas costas</text><text x="637" y="255" font-size="23" fill="#364d57">Com obstrução grave, incline a pessoa</text><text x="637" y="285" font-size="23" fill="#364d57">e aplique entre as escápulas.</text><rect x="38" y="392" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="392" rx="22" width="12" height="236" fill="#0b7285"/><circle cx="93" cy="448" r="30" fill="#0b7285"/><text x="93" y="458" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">3</text><text x="136" y="453" font-size="28" font-weight="800" fill="#122d39">5 compressões abdominais</text><text x="72" y="513" font-size="23" fill="#364d57">Alterne com as pancadas até o objeto</text><text x="72" y="543" font-size="23" fill="#364d57">sair ou a pessoa desmaiar.</text><rect x="603" y="392" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="392" rx="22" width="12" height="236" fill="#0b7285"/><circle cx="658" cy="448" r="30" fill="#0b7285"/><text x="658" y="458" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">4</text><text x="701" y="453" font-size="28" font-weight="800" fill="#122d39">Exceções e parada</text><text x="637" y="513" font-size="23" fill="#364d57">Gestante avançada: impulsos torácicos.</text><text x="637" y="543" font-size="23" fill="#364d57">Inconsciente: RCP.</text><rect x="37" y="652" width="1126" height="42" rx="12" fill="#0b7285" opacity=".1"/><text x="57" y="681" font-size="21" font-weight="700" fill="#233f4c">AHA 2025 • Peça 192 • Não ofereça água nem faça varredura cega</text></svg>