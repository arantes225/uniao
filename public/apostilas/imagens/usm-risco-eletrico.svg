<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Choque elétrico: não toque</title><desc id="desc">A eletricidade pode atingir quem tenta resgatar; Não se aproxime: Fios, partes energizadas e arco elétrico podem matar.; Isole e acione 193: Afaste outras pessoas. Informe local e tipo de equipamento.; Desenergização: Somente equipe autorizada confirma que a área está segura.; Só então atenda: Observe resposta e respiração; se indicado, RCP e DEA.</desc><rect width="1200" height="710" fill="#f5f9fa"/><rect width="1200" height="110" fill="#a56b11"/><text x="42" y="49" font-size="37" font-weight="800" fill="#fff">Choque elétrico: não toque</text><text x="42" y="84" font-size="22" fill="#fff">A eletricidade pode atingir quem tenta resgatar</text><rect x="940" y="18" rx="16" width="222" height="40" fill="#ffffff" opacity=".16"/><text x="1051" y="46" font-size="18" text-anchor="middle" font-weight="800" fill="#fff">ELETRICIDADE</text><rect x="38" y="134" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="134" rx="22" width="12" height="236" fill="#a56b11"/><circle cx="93" cy="190" r="30" fill="#a56b11"/><text x="93" y="200" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">1</text><text x="136" y="195" font-size="28" font-weight="800" fill="#122d39">Não se aproxime</text><text x="72" y="255" font-size="23" fill="#364d57">Fios, partes energizadas e arco</text><text x="72" y="285" font-size="23" fill="#364d57">elétrico podem matar.</text><rect x="603" y="134" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="134" rx="22" width="12" height="236" fill="#a56b11"/><circle cx="658" cy="190" r="30" fill="#a56b11"/><text x="658" y="200" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">2</text><text x="701" y="195" font-size="28" font-weight="800" fill="#122d39">Isole e acione 193</text><text x="637" y="255" font-size="23" fill="#364d57">Afaste outras pessoas. Informe local e</text><text x="637" y="285" font-size="23" fill="#364d57">tipo de equipamento.</text><rect x="38" y="392" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="392" rx="22" width="12" height="236" fill="#a56b11"/><circle cx="93" cy="448" r="30" fill="#a56b11"/><text x="93" y="458" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">3</text><text x="136" y="453" font-size="28" font-weight="800" fill="#122d39">Desenergização</text><text x="72" y="513" font-size="23" fill="#364d57">Somente equipe autorizada confirma que</text><text x="72" y="543" font-size="23" fill="#364d57">a área está segura.</text><rect x="603" y="392" rx="22" width="534" height="236" fill="white" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="392" rx="22" width="12" height="236" fill="#a56b11"/><circle cx="658" cy="448" r="30" fill="#a56b11"/><text x="658" y="458" text-anchor="middle" font-size="29" font-weight="800" fill="#fff">4</text><text x="701" y="453" font-size="28" font-weight="800" fill="#122d39">Só então atenda</text><text x="637" y="513" font-size="23" fill="#364d57">Observe resposta e respiração; se</text><text x="637" y="543" font-size="23" fill="#364d57">indicado, RCP e DEA.</text><rect x="37" y="652" width="1126" height="42" rx="12" fill="#a56b11" opacity=".1"/><text x="57" y="681" font-size="21" font-weight="700" fill="#233f4c">Nunca afaste fios com madeira, vassoura ou PVC improvisado</text></svg>