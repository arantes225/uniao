<rect x="39" y="561" width="1123" height="68" rx="13" fill="#e6f4ee" stroke="#83b5a0" stroke-width="2"/><text x="600" y="588" text-anchor="middle" font-size="20" fill="#245b47" font-weight="bold">Sinalize os equipamentos e treine o caminho seguro até a vítima.</text><text x="600" y="611" text-anchor="middle" font-size="17" fill="#41635a">Sem planta real, distâncias, saídas e posições deste exemplo não são operacionais.</text></g></svg>