<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-label="Dente arrancado após uma queda"><rect width="1200" height="710" fill="#f5f9fa"/><path d="M0 0H1200V110H0Z" fill="#1768ac"/><text x="42" y="47" font-family="Arial,sans-serif" font-size="37" font-weight="bold" fill="white">Dente arrancado após uma queda</text><text x="42" y="84" font-family="Arial,sans-serif" font-size="22" fill="white">Importante saber se o dente é de leite ou permanente</text><rect x="38" y="134" rx="22" width="534" height="236" fill="#fff" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="134" rx="18" width="12" height="236" fill="#1768ac"/><circle cx="94" cy="190" r="30" fill="#1768ac"/><text x="94" y="199" text-anchor="middle" fill="white" font-size="29" font-weight="bold" font-family="Arial,sans-serif">1</text><text x="134" y="199" fill="#12303b" font-size="26" font-weight="bold" font-family="Arial,sans-serif">Não toque na raiz</text><text x="72" y="255" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Segure a coroa (parte branca); evite</text><text x="72" y="285" fill="#364d57" font-size="23" font-family="Arial,sans-serif">esfregar.</text><rect x="603" y="134" rx="22" width="534" height="236" fill="#fff" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="134" rx="18" width="12" height="236" fill="#1768ac"/><circle cx="659" cy="190" r="30" fill="#1768ac"/><text x="659" y="199" text-anchor="middle" fill="white" font-size="29" font-weight="bold" font-family="Arial,sans-serif">2</text><text x="699" y="199" fill="#12303b" font-size="26" font-weight="bold" font-family="Arial,sans-serif">Dente permanente</text><text x="637" y="255" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Busque dentista imediatamente.</text><text x="637" y="285" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Reimplante só com orientação e</text><text x="637" y="315" fill="#364d57" font-size="23" font-family="Arial,sans-serif">segurança.</text><rect x="38" y="392" rx="22" width="534" height="236" fill="#fff" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="392" rx="18" width="12" height="236" fill="#1768ac"/><circle cx="94" cy="448" r="30" fill="#1768ac"/><text x="94" y="457" text-anchor="middle" fill="white" font-size="29" font-weight="bold" font-family="Arial,sans-serif">3</text><text x="134" y="457" fill="#12303b" font-size="26" font-weight="bold" font-family="Arial,sans-serif">Não dá para reimplantar?</text><text x="72" y="513" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Use solução própria, ou leite se não</text><text x="72" y="543" fill="#364d57" font-size="23" font-family="Arial,sans-serif">houver alternativa adequada.</text><rect x="603" y="392" rx="22" width="534" height="236" fill="#fff" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="392" rx="18" width="12" height="236" fill="#1768ac"/><circle cx="659" cy="448" r="30" fill="#1768ac"/><text x="659" y="457" text-anchor="middle" fill="white" font-size="29" font-weight="bold" font-family="Arial,sans-serif">4</text><text x="699" y="457" fill="#12303b" font-size="26" font-weight="bold" font-family="Arial,sans-serif">Dente de leite</text><text x="637" y="513" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Não tente recolocar; procure</text><text x="637" y="543" fill="#364d57" font-size="23" font-family="Arial,sans-serif">atendimento odontológico.</text><rect x="38" y="650" rx="12" width="1126" height="48" fill="#1768ac" opacity=".13"/><text x="55" y="681" font-size="20" font-weight="bold" fill="#12303b" font-family="Arial,sans-serif">AHA/Cruz Vermelha 2024 • Não deixe dente permanente secar nem guarde em água de torneira</text></svg>