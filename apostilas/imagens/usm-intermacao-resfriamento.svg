<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-label="Confusão após exercício no calor"><rect width="1200" height="710" fill="#f5f9fa"/><path d="M0 0H1200V110H0Z" fill="#a56b11"/><text x="42" y="47" font-family="Arial,sans-serif" font-size="37" font-weight="bold" fill="white">Confusão após exercício no calor</text><text x="42" y="84" font-family="Arial,sans-serif" font-size="22" fill="white">Suspeita de intermação: atendimento urgente</text><rect x="38" y="134" rx="22" width="534" height="236" fill="#fff" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="134" rx="18" width="12" height="236" fill="#a56b11"/><circle cx="94" cy="190" r="30" fill="#a56b11"/><text x="94" y="199" text-anchor="middle" fill="white" font-size="29" font-weight="bold" font-family="Arial,sans-serif">1</text><text x="134" y="199" fill="#12303b" font-size="26" font-weight="bold" font-family="Arial,sans-serif">Interrompa esforço</text><text x="72" y="255" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Leve a pessoa a local seguro e menos</text><text x="72" y="285" fill="#364d57" font-size="23" font-family="Arial,sans-serif">quente.</text><rect x="603" y="134" rx="22" width="534" height="236" fill="#fff" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="134" rx="18" width="12" height="236" fill="#a56b11"/><circle cx="659" cy="190" r="30" fill="#a56b11"/><text x="659" y="199" text-anchor="middle" fill="white" font-size="29" font-weight="bold" font-family="Arial,sans-serif">2</text><text x="699" y="199" fill="#12303b" font-size="26" font-weight="bold" font-family="Arial,sans-serif">Acione 192</text><text x="637" y="255" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Confusão, convulsão ou colapso com</text><text x="637" y="285" fill="#364d57" font-size="23" font-family="Arial,sans-serif">exposição ao calor são alertas.</text><rect x="38" y="392" rx="22" width="534" height="236" fill="#fff" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="392" rx="18" width="12" height="236" fill="#a56b11"/><circle cx="94" cy="448" r="30" fill="#a56b11"/><text x="94" y="457" text-anchor="middle" fill="white" font-size="29" font-weight="bold" font-family="Arial,sans-serif">3</text><text x="134" y="457" fill="#12303b" font-size="26" font-weight="bold" font-family="Arial,sans-serif">Inicie resfriamento</text><text x="72" y="513" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Molhe a pele e ventile. Imersão exige</text><text x="72" y="543" fill="#364d57" font-size="23" font-family="Arial,sans-serif">ambiente e equipe seguros.</text><rect x="603" y="392" rx="22" width="534" height="236" fill="#fff" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="392" rx="18" width="12" height="236" fill="#a56b11"/><circle cx="659" cy="448" r="30" fill="#a56b11"/><text x="659" y="457" text-anchor="middle" fill="white" font-size="29" font-weight="bold" font-family="Arial,sans-serif">4</text><text x="699" y="457" fill="#12303b" font-size="26" font-weight="bold" font-family="Arial,sans-serif">Observe respiração</text><text x="637" y="513" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Não dê líquido se estiver confusa ou</text><text x="637" y="543" fill="#364d57" font-size="23" font-family="Arial,sans-serif">sem engolir com segurança.</text><rect x="38" y="650" rx="12" width="1126" height="48" fill="#a56b11" opacity=".13"/><text x="55" y="681" font-size="20" font-weight="bold" fill="#12303b" font-family="Arial,sans-serif">AHA/Cruz Vermelha 2024 • Não espere medir temperatura para pedir ajuda</text></svg>