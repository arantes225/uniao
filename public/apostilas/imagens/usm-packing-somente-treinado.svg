<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-label="Ferida profunda: quando fazer packing"><rect width="1200" height="710" fill="#f5f9fa"/><path d="M0 0H1200V110H0Z" fill="#a23d45"/><text x="42" y="47" font-family="Arial,sans-serif" font-size="37" font-weight="bold" fill="white">Ferida profunda: quando fazer packing</text><text x="42" y="84" font-family="Arial,sans-serif" font-size="22" fill="white">Primeira ação para todos: compressão direta e SAMU</text><rect x="38" y="134" rx="22" width="534" height="236" fill="#fff" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="134" rx="18" width="12" height="236" fill="#a23d45"/><circle cx="94" cy="190" r="30" fill="#a23d45"/><text x="94" y="199" text-anchor="middle" fill="white" font-size="29" font-weight="bold" font-family="Arial,sans-serif">1</text><text x="134" y="199" fill="#12303b" font-size="26" font-weight="bold" font-family="Arial,sans-serif">Comece pressionando</text><text x="72" y="255" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Use gaze ou tecido limpo. Mantenha</text><text x="72" y="285" fill="#364d57" font-size="23" font-family="Arial,sans-serif">pressão sobre a ferida.</text><rect x="603" y="134" rx="22" width="534" height="236" fill="#fff" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="134" rx="18" width="12" height="236" fill="#a23d45"/><circle cx="659" cy="190" r="30" fill="#a23d45"/><text x="659" y="199" text-anchor="middle" fill="white" font-size="29" font-weight="bold" font-family="Arial,sans-serif">2</text><text x="699" y="199" fill="#12303b" font-size="26" font-weight="bold" font-family="Arial,sans-serif">Peça ajuda</text><text x="637" y="255" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Ligue 192. Solicite material e outro</text><text x="637" y="285" fill="#364d57" font-size="23" font-family="Arial,sans-serif">socorrista.</text><rect x="38" y="392" rx="22" width="534" height="236" fill="#fff" stroke="#d9e4e8" stroke-width="2"/><rect x="38" y="392" rx="18" width="12" height="236" fill="#a23d45"/><circle cx="94" cy="448" r="30" fill="#a23d45"/><text x="94" y="457" text-anchor="middle" fill="white" font-size="29" font-weight="bold" font-family="Arial,sans-serif">3</text><text x="134" y="457" fill="#12303b" font-size="26" font-weight="bold" font-family="Arial,sans-serif">Packing: só com treino</text><text x="72" y="513" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Pessoa treinada pode usar gaze em</text><text x="72" y="543" fill="#364d57" font-size="23" font-family="Arial,sans-serif">região adequada, como virilha.</text><rect x="603" y="392" rx="22" width="534" height="236" fill="#fff" stroke="#d9e4e8" stroke-width="2"/><rect x="603" y="392" rx="18" width="12" height="236" fill="#a23d45"/><circle cx="659" cy="448" r="30" fill="#a23d45"/><text x="659" y="457" text-anchor="middle" fill="white" font-size="29" font-weight="bold" font-family="Arial,sans-serif">4</text><text x="699" y="457" fill="#12303b" font-size="26" font-weight="bold" font-family="Arial,sans-serif">Não explore</text><text x="637" y="513" fill="#364d57" font-size="23" font-family="Arial,sans-serif">Não procure vasos com dedos; não faça</text><text x="637" y="543" fill="#364d57" font-size="23" font-family="Arial,sans-serif">packing em tórax ou abdome.</text><rect x="38" y="650" rx="12" width="1126" height="48" fill="#a23d45" opacity=".13"/><text x="55" y="681" font-size="20" font-weight="bold" fill="#12303b" font-family="Arial,sans-serif">Pratique packing somente em simulador • Orientação baseada em primeiros socorros AHA 2024</text></svg>