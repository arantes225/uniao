<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="ttl desc"><title id="ttl">Organização inicial de ocorrência com múltiplas vítimas</title><desc id="desc">Vista superior ilustrada de ocorrência complexa: área perigosa isolada, vítimas representadas por círculos, corredor de acesso para equipes treinadas, posto de comando, área segura de apoio e acionamento do SAMU 192 e Bombeiros 193. Leigos não devem entrar em área insegura ou aplicar triagem START sem treinamento.</desc><defs><marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0L11 4L0 8Z" fill="#18846a"/></marker><pattern id="haz" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 24L24 0" stroke="#f0ada0" stroke-width="8" /></pattern></defs><rect width="1200" height="650" fill="#eff7f7"/><rect width="1200" height="91" fill="#0c5e66"/><g font-family="Arial,sans-serif"><text x="37" y="51" fill="#fff" font-size="31" font-weight="bold">Múltiplas vítimas: organização e segurança</text><text x="37" y="78" fill="#e1f8f3" font-size="18">Esquema de cena • a triagem formal depende de equipe e protocolo treinados</text><rect x="40" y="120" width="730" height="405" rx="22" fill="#fff" stroke="#8eafb4" stroke-width="4"/><rect x="67" y="154" width="390" height="333" rx="20" fill="url(#haz)" stroke="#c96558" stroke-width="5" stroke-dasharray="14 10"/><text x="260" y="189" text-anchor="middle" fill="#8a443b" font-size="23" font-weight="bold">ÁREA DE RISCO</text><circle cx="158" cy="260" r="22" fill="#a88ea3"/><circle cx="296" cy="291" r="22" fill="#a88ea3"/><circle cx="231" cy="397" r="22" fill="#a88ea3"/><circle cx="359" cy="376" r="22" fill="#a88ea3"/><path d="M130 485H770" stroke="#d78d65" stroke-width="7" stroke-dasharray="13 10"/><text x="600" y="213" text-anchor="middle" font-size="22" fill="#205e69" font-weight="bold">CORREDOR DE ACESSO</text><text x="600" y="239" text-anchor="middle" font-size="17" fill="#205e69">somente equipes autorizadas</text><path d="M568 266V434" fill="none" stroke="#18846a" stroke-width="15" stroke-dasharray="18 14" marker-end="url(#arr)"/><rect x="795" y="122" width="368" height="110" rx="18" fill="#e8f6ed" stroke="#82b99b" stroke-width="3"/><text x="978" y="164" text-anchor="middle" fill="#236948" font-size="25" font-weight="bold">POSTO DE COMANDO</text><text x="978" y="196" text-anchor="middle" fill="#426b52" font-size="18">coordenação das equipes</text><rect x="795" y="245" width="368" height="117" rx="18" fill="#e6f4ff" stroke="#80b2cd" stroke-width="3"/><text x="978" y="291" text-anchor="middle" fill="#255e85" font-size="26" font-weight="bold">192 / 193</text><text x="978" y="325" text-anchor="middle" fill="#426c84" font-size="17">local, riscos e número aproximado de vítimas</text><rect x="795" y="378" width="368" height="145" rx="18" fill="#f1f8ff" stroke="#89b6cf" stroke-width="3"/><text x="979" y="426" text-anchor="middle" fill="#245e7f" font-size="25" font-weight="bold">ÁREA SEGURA</text><text x="979" y="459" text-anchor="middle" fill="#426a81" font-size="18">apoio e chegada do socorro</text><path d="M840 493H1123" stroke="#22866a" stroke-width="9"/><rect x="40" y="550" width="1123" height="74" rx="14" fill="#fff1e8" stroke="#dcad8f" stroke-width="2"/><text x="601" y="580" text-anchor="middle" font-size="22" font-weight="bold" fill="#9a4b33">Não entre em cenário instável para classificar ou remover vítimas.</text><text x="601" y="605" text-anchor="middle" font-size="18" fill="#745c52">O desenho é ilustrativo; o comandante do resgate define zonas, rotas e prioridades.</text></g></svg>